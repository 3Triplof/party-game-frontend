<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>TRIPLO F Party Game</title>

<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎉 TRIPLO F - Party Game</h1>

<!-- ================= MENU ================= -->
<div id="menu">
<input id="nome" placeholder="Seu nome">
<br>
<button onclick="criarSala()">Criar Sala</button>
<br><br>
<input id="codigoSala" placeholder="Código da sala">
<br>
<button onclick="entrarSala()">Entrar</button>
</div>

<!-- ================= JOGO ================= -->
<div id="jogo" style="display:none;">

<!-- Dentro da div #jogo -->
<div class="timer-container" id="timer">
<div class="timer-circle" id="timerCircle">
<div class="timer-numero" id="timerNumero">10</div>
</div>
</div>

<h2 id="codigo"></h2>

<!-- ================= PERGUNTA ================= -->
<div id="areaPergunta">
<h3 id="pergunta"></h3>

<!-- RESPOSTAS -->
<div id="respostas">
<button class="btn-opcao" onclick="responder('A')">A</button>
<button class="btn-opcao" onclick="responder('B')">B</button>
<button class="btn-opcao" onclick="responder('C')">C</button>
<button class="btn-opcao" onclick="responder('D')">D</button>
</div>

</div>

<!-- 👑 HOST -->
<button
id="btnRodada"
onclick="iniciarRodada()"
style="display:none;"
>
▶ Iniciar Rodada
</button>

<!-- 👥 JOGADORES -->
<p
id="aguarde"
style="display:none; font-weight:bold;"
>
⏳ Aguardando o host iniciar a rodada...
</p>

<!-- ================= RANKING FINAL ================= -->
<div id="ranking" class="ranking hidden"></div>

</div>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="script.js"></script>

</body>
</html>
