<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>TRIPLO F Party Game</title>

  <!-- favicon evita erro CORB -->
  <link rel="icon" href="data:,">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>TRIPLO F - Party Game 🎉</h1>

<!-- ================= MENU ================= -->
<div id="menu">
  <input id="nome" placeholder="Seu nome">
  <br>
  <button onclick="criarSala()">Criar Sala</button>
  <br><br>
  <input id="codigoSala" placeholder="Código da sala">
  <br>
  <button onclick="entrarSala()">Entrar</button>
</div>

<!-- ================= JOGO ================= -->
<div id="jogo" style="display:none;">

  <h2 id="codigo"></h2>
  <h3 id="pergunta"></h3>

  <input id="resposta" placeholder="Sua resposta">
  <button onclick="enviarResposta()">Enviar</button>

  <br><br>

  <!-- 👑 BOTÃO SOMENTE PARA O HOST -->
  <button
    id="btnRodada"
    onclick="iniciarRodada()"
    style="display:none;"
  >
    Iniciar Rodada
  </button>

  <!-- 👥 TEXTO PARA JOGADORES -->
  <p
    id="aguarde"
    style="display:none; font-weight:bold;"
  >
    ⏳ Aguardando o host iniciar a rodada...
  </p>

  <ul id="ranking"></ul>
</div>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="script.js"></script>

</body>
</html>
