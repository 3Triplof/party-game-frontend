<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIPLO F Party Game</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎉 TRIPLO F - Party Game</h1>

    <!-- MENU -->
    <div id="menu">
      <div class="input-group">
        <input id="nome" placeholder="Seu nome">
      </div>
      <button class="btn" onclick="criarSala()">Criar Sala</button>
      
      <div style="margin: 25px 0;">
        <hr style="border: none; height: 1px; background: rgba(255,255,255,0.2); margin: 25px 0;">
        <span style="font-size: 14px; opacity: 0.8;">OU</span>
        <hr style="border: none; height: 1px; background: rgba(255,255,255,0.2); margin: 25px 0;">
      </div>
      
      <div class="input-group">
        <input id="codigoSala" placeholder="Código da sala">
      </div>
      <button class="btn" onclick="entrarSala()">Entrar na Sala</button>
    </div>

    <!-- JOGO -->
    <div id="jogo" style="display:none;">
      <div class="header-jogo">
        <div id="codigo"></div>
        <button id="btnRodada" class="btn" onclick="iniciarRodada()" style="display:none;">
          ▶ Nova Pergunta
        </button>
        <p id="aguarde" style="display:none;">
          ⏳ Aguardando o host iniciar a rodada...
        </p>
      </div>

      <!-- TIMER (CORRIGIDO: inicia HIDDEN) -->
      <div class="timer-container" id="timer" style="display:none;">
        <div class="timer-circle" id="timerCircle">
          <div class="timer-numero" id="timerNumero">10</div>
        </div>
      </div>

      <!-- PERGUNTA -->
      <div class="pergunta-container">
        <div id="pergunta"></div>
        
        <!-- RESPOSTAS (CORRIGIDO: SEM .hidden inicial) -->
        <div id="respostas" style="display:none;">
          <button class="btn-opcao" onclick="responder('A')">A</button>
          <button class="btn-opcao" onclick="responder('B')">B</button>
          <button class="btn-opcao" onclick="responder('C')">C</button>
          <button class="btn-opcao" onclick="responder('D')">D</button>
        </div>
      </div>

      <div id="ranking" class="ranking hidden"></div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
